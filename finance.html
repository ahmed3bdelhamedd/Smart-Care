<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Care | Financial Health & Analytics</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="page-container animate-fade">
    <div class="section-header">
      <h2>💰 Financial Health & Cash Flow Intelligence</h2>
      <p>Advanced financial auditing and forecasting comparable to tier-one global audit standards (Deloitte & KPMG).</p>
    </div>
    <div class="grid-3" style="margin-bottom: 35px;">
      <div class="glass-card">
        <p style="color: var(--text-muted); font-size: 14px;">Free Cash Flow</p>
        <h3 style="font-size: 28px; font-weight: 900; color: var(--accent-cyan);">$840,000</h3>
        <span class="badge badge-success" style="margin-top: 10px;">Stable & Robust</span>
      </div>
      <div class="glass-card">
        <p style="color: var(--text-muted); font-size: 14px;">Return on Investment (ROI)</p>
        <h3 style="font-size: 28px; font-weight: 900; color: var(--accent-emerald);">28.4%</h3>
        <span class="badge badge-success" style="margin-top: 10px;">Exceeds Target</span>
      </div>
      <div class="glass-card">
        <p style="color: var(--text-muted); font-size: 14px;">Projected Opex</p>
        <h3 style="font-size: 28px; font-weight: 900; color: var(--accent-amber);">$310,000</h3>
        <span class="badge badge-warning" style="margin-top: 10px;">Optimization Suggested</span>
      </div>
    </div>
  </div>
  <script>
    fetch('header.html').then(res => res.text()).then(data => {
      document.getElementById('navbar-placeholder').innerHTML = data;
      const cur = window.location.pathname.split("/").pop() || 'index.html';
      document.querySelectorAll('.nav-link-item').forEach(l => {
        if(l.getAttribute('data-page') === cur) l.classList.add('active');
      });
    });
  </script>
</body>
</html>
